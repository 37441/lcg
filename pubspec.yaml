name: lcg
description: "吾爱破解论坛客户端（Flutter 重写版）"
publish_to: 'none'
version: 1.9.2+10902

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 网络与 Cookie
  dio: ^5.7.0
  cookie_jar: ^4.0.0
  dio_cookie_manager: ^3.1.0

  # HTML 解析与渲染
  html: ^0.15.4
  flutter_widget_from_html: ^0.15.0
  crypto: ^3.0.3

  # 状态与存储
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  sqflite: ^2.4.0
  path: ^1.9.0
  path_provider: ^2.1.4

  # 视图
  cached_network_image: ^3.4.0
  flutter_inappwebview: ^6.1.5
  url_launcher: ^6.3.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true